apply plugin: 'com.android.library'

android {
    compileSdk 37
    namespace 'com.sofit.onlinechatsdk'
    defaultConfig {
        minSdkVersion 21
        versionCode 52
        versionName '0.5.2'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1' // 1.12.0
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1' // 1.6.1
    implementation 'androidx.annotation:annotation:1.11.0' // 1.9.1
    implementation 'androidx.activity:activity-ktx:1.11.0' // 1.9.3
    implementation 'androidx.webkit:webkit:1.14.0' // 1.11.0
    testImplementation 'junit:junit:4.13.2'
}